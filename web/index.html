<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormCoach — AI Workout Form Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Form<span class="brand-accent">Coach</span></span>
      </div>
      <nav class="topbar-meta">
        <span class="pill" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">Idle</span></span>
      </nav>
    </header>

    <!-- Main -->
    <main class="stage">
      <!-- Video card -->
      <section class="video-card">
        <div class="video-wrap">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>

          <!-- Loading / permission states -->
          <div class="video-overlay" id="videoOverlay">
            <div class="overlay-inner">
              <div class="spinner" id="spinner" hidden></div>
              <h2 id="overlayTitle">Ready when you are</h2>
              <p id="overlaySubtitle">Allow camera access and pick an exercise to start your session.</p>
              <button class="btn btn-primary" id="startBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Start camera
              </button>
            </div>
          </div>

          <!-- Floating live chips -->
          <div class="chips" id="liveChips" hidden>
            <span class="chip" id="repChipMini">0 reps</span>
            <span class="chip chip-form" id="formChipMini">—</span>
          </div>
        </div>

        <div class="video-controls">
          <div class="exercise-switch" id="exerciseSwitch" role="tablist" aria-label="Exercise">
            <button class="ex-btn is-active" data-ex="squat" role="tab">Squat</button>
            <button class="ex-btn" data-ex="pushup" role="tab">Push-up</button>
            <button class="ex-btn" data-ex="plank" role="tab">Plank</button>
          </div>
          <button class="btn btn-ghost" id="stopBtn" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            Stop
          </button>
        </div>
      </section>

      <!-- Side panel -->
      <aside class="panel">
        <!-- Rep / primary metric -->
        <div class="card metric-card">
          <span class="card-label" id="primaryLabel">Reps</span>
          <div class="metric-value" id="primaryValue">0</div>
          <div class="metric-sub" id="primarySub">Squat session</div>
        </div>

        <!-- Form status -->
        <div class="card form-card" id="formCard">
          <span class="card-label">Form</span>
          <div class="form-status" id="formStatus">
            <span class="form-badge" id="formBadge">Waiting</span>
          </div>
          <div class="ml-verdict" id="mlVerdict" hidden>
            <span class="ml-tag">AI</span>
            <span class="ml-text" id="mlVerdictText">—</span>
            <span class="ml-prob" id="mlVerdictProb"></span>
          </div>
          <ul class="cues" id="cues">
            <li class="cue cue-muted">Stand in frame to begin analysis.</li>
          </ul>
        </div>

        <!-- Live angles -->
        <div class="card stats-card">
          <span class="card-label">Live metrics</span>
          <div class="stat-row"><span>Knee angle</span><b id="kneeVal">—</b></div>
          <div class="stat-row"><span>Body line</span><b id="backVal">—</b></div>
          <div class="stat-row"><span>Tempo</span><b id="tempoVal">—</b></div>
          <div class="stat-row"><span>Session</span><b id="timerVal">00:00</b></div>
        </div>

        <button class="btn btn-soft btn-block" id="resetBtn">Reset session</button>
      </aside>
    </main>

    <footer class="footer">
      <span>Runs fully on-device · MediaPipe Pose</span>
      <span class="footer-hint" id="fpsHint"></span>
    </footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
